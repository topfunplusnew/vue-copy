name: iPoloGO Vue deploy

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --no-frozen-lockfile
          fi

      - name: Build project
        run: pnpm run build

      - name: Generate file checksums
        run: |
          cd dist
          find . -type f -exec md5sum {} \; > ../file-checksums.txt

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./dist
            ./file-checksums.txt
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: dist

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
             DEPLOY_PATH=\${DEPLOY_PATH/#\~/\$HOME}
             mkdir -p \$DEPLOY_PATH
             mkdir -p \$HOME/backups/ipologo"

      - name: Backup current deployment
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
             DEPLOY_PATH=\${DEPLOY_PATH/#\~/\$HOME}
             if [ -d \"\$DEPLOY_PATH\" ] && [ -n \"\$(ls -A \"\$DEPLOY_PATH\" 2>/dev/null)\" ]; then
               BACKUP_DIR=\$HOME/backups/ipologo
               BACKUP_FILE=\$BACKUP_DIR/dist-\$(date +%Y%m%d-%H%M%S).tar.gz
               mkdir -p \$BACKUP_DIR
               tar -czf \$BACKUP_FILE -C \"\$DEPLOY_PATH\" . 2>/dev/null || true
               ls -t \$BACKUP_DIR/dist-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f 2>/dev/null || true
             fi"

      - name: Deploy to Server via rsync
        run: |
          DEPLOY_PATH_REMOTE=$(ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'; echo \${DEPLOY_PATH/#\~/\$HOME}")
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            ./dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:\$DEPLOY_PATH_REMOTE/

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
             DEPLOY_PATH=\${DEPLOY_PATH/#\~/\$HOME}
             [ -d \"\$DEPLOY_PATH\" ] || exit 1"
