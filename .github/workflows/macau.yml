name: iPoloGO Vue deploy

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  DEPLOY_PATH: '/data/html/ipologo'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          # 先尝试使用 frozen lockfile，如果失败则更新 lockfile
          if ! pnpm install --frozen-lockfile; then
            echo "⚠️ Warning: pnpm-lock.yaml is out of date, updating..."
            pnpm install --no-frozen-lockfile
            echo "⚠️ Please commit the updated pnpm-lock.yaml file"
          fi

      - name: Build project
        run: pnpm run build

      - name: Generate file checksums
        run: |
          cd dist
          find . -type f -exec md5sum {} \; > ../file-checksums.txt
          echo "Generated checksums for $(find . -type f | wc -l) files"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./dist
            ./file-checksums.txt
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Secrets not set, skipping deploy"
            exit 0
          fi

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo 'SSH connection successful'"

      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "if [ -d '${{ env.DEPLOY_PATH }}' ]; then
              BACKUP_DIR='/data/backups/ipologo'
              mkdir -p \$BACKUP_DIR
              BACKUP_FILE=\$BACKUP_DIR/dist-\$(date +%Y%m%d-%H%M%S).tar.gz
              tar -czf \$BACKUP_FILE -C ${{ env.DEPLOY_PATH }} .
              echo 'Backup created: '\$BACKUP_FILE
              ls -t \$BACKUP_DIR/dist-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f || true
            else
              echo 'Deploy path does not exist, skipping backup'
            fi"

      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo 'Ensuring deployment directory exists...'
             if sudo mkdir -p ${{ env.DEPLOY_PATH }} 2>/dev/null; then
               sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${{ env.DEPLOY_PATH }}
               sudo chmod 755 ${{ env.DEPLOY_PATH }}
               echo 'Directory created with sudo: ${{ env.DEPLOY_PATH }}'
             elif mkdir -p ${{ env.DEPLOY_PATH }} 2>/dev/null; then
               chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${{ env.DEPLOY_PATH }} 2>/dev/null || true
               chmod 755 ${{ env.DEPLOY_PATH }}
               echo 'Directory created without sudo: ${{ env.DEPLOY_PATH }}'
             else
               echo 'ERROR: Failed to create directory ${{ env.DEPLOY_PATH }}'
               exit 1
             fi
             if [ ! -d '${{ env.DEPLOY_PATH }}' ]; then
               echo 'ERROR: Directory does not exist after creation attempt'
               exit 1
             fi
             echo 'Directory verified: ${{ env.DEPLOY_PATH }}'"

      - name: Deploy to Server via rsync (Incremental Update)
        run: |
          # 确保目标目录存在（双重保险）
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }} || sudo mkdir -p ${{ env.DEPLOY_PATH }}"
          
          # 执行 rsync 部署
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }} -o StrictHostKeyChecking=no" \
            ./dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/
          echo "Deployment completed with incremental update"

      - name: Verify deployment on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '=== Deployment Verification ==='
            echo ''
            echo 'Files in ${{ env.DEPLOY_PATH }}:'
            ls -lah ${{ env.DEPLOY_PATH }}/ | head -20
            echo ''
            echo 'Total files:'
            find ${{ env.DEPLOY_PATH }} -type f | wc -l
            echo ''
            echo 'Directory size:'
            du -sh ${{ env.DEPLOY_PATH }}
            echo ''
            echo 'Latest files modified:'
            find ${{ env.DEPLOY_PATH }} -type f -printf '%T@ %p\n' | sort -n | tail -5 | awk '{print strftime(\"%Y-%m-%d %H:%M:%S\", \$1), \$2}'
            echo ''
            echo 'Nginx status:'
            sudo systemctl status nginx --no-pager || true"
