name: iPoloGO Vue deploy

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  DEPLOY_PATH: '/data/html/ipologo'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          # 先尝试使用 frozen lockfile，如果失败则更新 lockfile
          if ! pnpm install --frozen-lockfile; then
            echo "⚠️ Warning: pnpm-lock.yaml is out of date, updating..."
            pnpm install --no-frozen-lockfile
            echo "⚠️ Please commit the updated pnpm-lock.yaml file"
          fi

      - name: Build project
        run: pnpm run build

      - name: Generate file checksums
        run: |
          cd dist
          find . -type f -exec md5sum {} \; > ../file-checksums.txt
          echo "Generated checksums for $(find . -type f | wc -l) files"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./dist
            ./file-checksums.txt
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "Secrets not set, skipping deploy"
            exit 0
          fi

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo 'SSH connection successful'"

      - name: Prepare server directories
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '=== Preparing server directories ==='
             echo 'Current user: '\$(whoami)
             echo 'Current directory: '\$(pwd)
             echo ''
             
             # 诊断信息
             DEPLOY_PATH='${{ env.DEPLOY_PATH }}'
             DEPLOY_USER='${{ secrets.DEPLOY_USER }}'
             PARENT_DIR=\$(dirname \$DEPLOY_PATH)
             
             echo 'Target deployment path: '\$DEPLOY_PATH
             echo 'Parent directory: '\$PARENT_DIR
             echo ''
             
             # 检查父目录
             echo 'Checking parent directory: '\$PARENT_DIR
             if [ ! -d \$PARENT_DIR ]; then
               echo 'Parent directory does not exist, attempting to create...'
               if sudo mkdir -p \$PARENT_DIR 2>/dev/null; then
                 sudo chown root:root \$PARENT_DIR 2>/dev/null || true
                 sudo chmod 755 \$PARENT_DIR 2>/dev/null || true
                 echo '✓ Parent directory created with sudo'
               elif mkdir -p \$PARENT_DIR 2>/dev/null; then
                 echo '✓ Parent directory created without sudo'
               else
                 echo '✗ ERROR: Cannot create parent directory '\$PARENT_DIR
                 echo 'Please ensure the parent directory exists or configure sudo permissions'
                 exit 1
               fi
             else
               echo '✓ Parent directory exists'
               ls -ld \$PARENT_DIR
             fi
             echo ''
             
             # 创建部署目录
             echo 'Creating deployment directory: '\$DEPLOY_PATH
             if sudo mkdir -p \$DEPLOY_PATH 2>/dev/null; then
               sudo chown -R \$DEPLOY_USER:\$DEPLOY_USER \$DEPLOY_PATH
               sudo chmod 755 \$DEPLOY_PATH
               echo '✓ Deployment directory created with sudo'
             elif mkdir -p \$DEPLOY_PATH 2>/dev/null; then
               chown -R \$DEPLOY_USER:\$DEPLOY_USER \$DEPLOY_PATH 2>/dev/null || true
               chmod 755 \$DEPLOY_PATH 2>/dev/null || true
               echo '✓ Deployment directory created without sudo'
             else
               echo '✗ ERROR: Failed to create deployment directory'
               echo 'Attempted paths:'
               echo '  - '\$DEPLOY_PATH
               echo ''
               echo 'Diagnostic information:'
               echo '  Parent directory exists: '\$([ -d \$PARENT_DIR ] && echo 'yes' || echo 'no')
               echo '  Parent directory writable: '\$([ -w \$PARENT_DIR ] && echo 'yes' || echo 'no')
               echo '  Has sudo access: '\$(sudo -n true 2>/dev/null && echo 'yes' || echo 'no')
               echo ''
               echo 'SOLUTION: Please run on server as root:'
               echo '  sudo mkdir -p '\$DEPLOY_PATH
               echo '  sudo chown -R '\$DEPLOY_USER':'\$DEPLOY_USER' '\$DEPLOY_PATH
               echo '  sudo chmod 755 '\$DEPLOY_PATH
               exit 1
             fi
             
             # 验证部署目录
             if [ ! -d \$DEPLOY_PATH ]; then
               echo '✗ ERROR: Deployment directory does not exist after creation attempt'
               exit 1
             fi
             
             # 检查目录权限
             if [ ! -w \$DEPLOY_PATH ]; then
               echo '⚠ WARNING: Deployment directory is not writable'
               echo 'Attempting to fix permissions...'
               sudo chown -R \$DEPLOY_USER:\$DEPLOY_USER \$DEPLOY_PATH 2>/dev/null || \
               chown -R \$DEPLOY_USER:\$DEPLOY_USER \$DEPLOY_PATH 2>/dev/null || true
               sudo chmod 755 \$DEPLOY_PATH 2>/dev/null || \
               chmod 755 \$DEPLOY_PATH 2>/dev/null || true
             fi
             
             echo '✓ Deployment directory verified and ready'
             echo ''
             
             # 创建备份目录
             BACKUP_DIR='/data/backups/ipologo'
             BACKUP_PARENT=\$(dirname \$BACKUP_DIR)
             echo 'Creating backup directory: '\$BACKUP_DIR
             
             # 确保备份父目录存在
             if [ ! -d \$BACKUP_PARENT ]; then
               sudo mkdir -p \$BACKUP_PARENT 2>/dev/null || mkdir -p \$BACKUP_PARENT 2>/dev/null || true
             fi
             
             if sudo mkdir -p \$BACKUP_DIR 2>/dev/null; then
               sudo chown -R \$DEPLOY_USER:\$DEPLOY_USER \$BACKUP_DIR
               sudo chmod 755 \$BACKUP_DIR
               echo '✓ Backup directory created with sudo'
             elif mkdir -p \$BACKUP_DIR 2>/dev/null; then
               chown -R \$DEPLOY_USER:\$DEPLOY_USER \$BACKUP_DIR 2>/dev/null || true
               chmod 755 \$BACKUP_DIR 2>/dev/null || true
               echo '✓ Backup directory created without sudo'
             else
               echo '⚠ WARNING: Failed to create backup directory, backup will be skipped'
               echo 'Backup directory will be created in user home if needed'
             fi
             
             echo ''
             echo '=== Directory preparation completed ==='"

      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "if [ -d '${{ env.DEPLOY_PATH }}' ] && [ -n \"\$(ls -A ${{ env.DEPLOY_PATH }} 2>/dev/null)\" ]; then
              BACKUP_DIR='/data/backups/ipologo'
              mkdir -p \$BACKUP_DIR 2>/dev/null || sudo mkdir -p \$BACKUP_DIR 2>/dev/null || true
              if [ -w \$BACKUP_DIR ] || sudo test -w \$BACKUP_DIR; then
                BACKUP_FILE=\$BACKUP_DIR/dist-\$(date +%Y%m%d-%H%M%S).tar.gz
                if sudo tar -czf \$BACKUP_FILE -C ${{ env.DEPLOY_PATH }} . 2>/dev/null || tar -czf \$BACKUP_FILE -C ${{ env.DEPLOY_PATH }} . 2>/dev/null; then
                  echo '✓ Backup created: '\$BACKUP_FILE
                  ls -t \$BACKUP_DIR/dist-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f 2>/dev/null || true
                else
                  echo '⚠ WARNING: Failed to create backup, continuing deployment'
                fi
              else
                echo '⚠ WARNING: Backup directory not writable, skipping backup'
              fi
            else
              echo 'ℹ Deploy path does not exist or is empty, skipping backup'
            fi"

      - name: Deploy to Server via rsync (Incremental Update)
        run: |
          # 最终确认目录存在
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "if [ ! -d '${{ env.DEPLOY_PATH }}' ]; then
              echo 'ERROR: Deployment directory does not exist, attempting to create...'
              sudo mkdir -p ${{ env.DEPLOY_PATH }} || mkdir -p ${{ env.DEPLOY_PATH }} || exit 1
              sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${{ env.DEPLOY_PATH }} || chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${{ env.DEPLOY_PATH }} || true
            fi
            if [ ! -d '${{ env.DEPLOY_PATH }}' ]; then
              echo 'ERROR: Failed to ensure deployment directory exists'
              exit 1
            fi
            echo '✓ Deployment directory verified'"
          
          # 执行 rsync 部署
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }} -o StrictHostKeyChecking=no" \
            ./dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/
          echo "✓ Deployment completed with incremental update"

      - name: Verify deployment on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '=== Deployment Verification ==='
            echo ''
            if [ -d '${{ env.DEPLOY_PATH }}' ]; then
              echo '✓ Deployment directory exists: ${{ env.DEPLOY_PATH }}'
              echo ''
              echo 'Files in ${{ env.DEPLOY_PATH }}:'
              ls -lah ${{ env.DEPLOY_PATH }}/ 2>/dev/null | head -20 || echo '⚠ Cannot list files'
              echo ''
              echo 'Total files:'
              find ${{ env.DEPLOY_PATH }} -type f 2>/dev/null | wc -l || echo '0'
              echo ''
              echo 'Directory size:'
              du -sh ${{ env.DEPLOY_PATH }} 2>/dev/null || echo 'Unknown'
              echo ''
              echo 'Latest files modified:'
              find ${{ env.DEPLOY_PATH }} -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -5 | awk '{print strftime(\"%Y-%m-%d %H:%M:%S\", \$1), \$2}' || echo 'Cannot determine file modification times'
            else
              echo '✗ ERROR: Deployment directory does not exist: ${{ env.DEPLOY_PATH }}'
              exit 1
            fi
            echo ''
            echo 'Nginx status:'
            sudo systemctl status nginx --no-pager 2>/dev/null || systemctl status nginx --no-pager 2>/dev/null || echo '⚠ Cannot check Nginx status'"
