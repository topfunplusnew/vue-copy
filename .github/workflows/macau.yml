name: iPoloGO Vue deploy

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  NODE_VERSION: '18.x' # set this to the node version to use

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Secrets not set, skipping deploy"
            exit 0
          fi
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: dist

      - name: 'Debug: List dist files'
        run: |
          echo "Content of dist directory:"
          ls -la dist/
          echo ""
          echo "Total files:"
          find dist -type f | wc -l

      - name: 'Deploy to Server via SCP'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist/*"
          target: "/data/html/ipologo"
          strip_components: 1

      - name: 'Verify deployment on server'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "Files in /data/html/ipologo:"
            ls -la /data/html/ipologo/ | head -20
            echo ""
            echo "File count:"
            find /data/html/ipologo -type f | wc -l
            echo ""
            echo "Nginx status:"
            sudo systemctl status nginx
